<!doctype html>
<html lang="pt-BR" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head th:replace="~{layout :: cabecalho('Ordens de serviço')}"></head>
<body>
<header th:replace="~{layout :: menu}"></header>
<main class="container">
  <div class="titulo">
    <h1>Ordens de serviço</h1>
  </div>
  <div th:replace="~{layout :: mensagens}"></div>
  <p th:if="${ordens.empty}" class="painel">Nenhuma ordem cadastrada.</p>
  <div th:unless="${ordens.empty}" class="tabela">
    <table>
      <thead><tr><th>Ordem</th><th>Cliente</th><th>Equipamento</th><th>Técnico</th><th>Status</th></tr></thead>
      <tbody>
        <tr th:each="ordem : ${ordens}">
          <td><a th:href="@{/ordens/{id}(id=${ordem.id})}" th:text="|#${ordem.id}|"></a></td>
          <td th:text="${ordem.cliente.nome}"></td>
          <td th:text="${ordem.equipamento.modelo}"></td>
          <td th:text="${ordem.tecnico.nome}"></td>
          <td><span class="status" th:text="${ordem.status.rotulo}"></span></td>
        </tr>
      </tbody>
    </table>
  </div>
</main>
</body>
</html>
